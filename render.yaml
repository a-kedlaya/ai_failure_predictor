services:
  # Django Backend
  - type: web
    name: project-failure-predictor-api
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn core.wsgi:application"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: RENDER_FRONTEND_URL
        fromService:
          name: project-failure-predictor-frontend
          type: web
          property: host
          envVarKey: RENDER_FRONTEND_URL

  # React Frontend (Static Site)
  - type: web
    name: project-failure-predictor-frontend
    runtime: static
    buildCommand: "cd frontend && npm ci && npm run build"
    staticPublishPath: "frontend/dist"
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
